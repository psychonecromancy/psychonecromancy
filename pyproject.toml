[project]
name = "psychonecromancy"
version = "0.1.0"
description = "Median-life historical video pipeline"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "websocket-client>=1.7",
]

[project.scripts]
psycho = "psychonecromancy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
